<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c2c2c">
  <meta name="description" content="No.Skip.FM. Your personal vinyl listening room.">
  <title>No.Skip.FM</title>
  <link rel="icon" type="image/svg+xml" href="./assets/studio-gh-mark.svg">
  <link rel="apple-touch-icon" href="./assets/studio-gh-mark.svg">
  <style>
    :root { color-scheme: dark; --ink: #2c2c2c; --paper: #fffcf4; --accent: #f99a16; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 32px; background: var(--ink); color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { display: grid; justify-items: center; gap: 22px; text-align: center; }
    .mark { display: block; width: clamp(112px, 22vw, 190px); height: auto; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; letter-spacing: -.075em; font-weight: 800; }
    p { margin: 0; color: rgba(255,252,244,.68); font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./assets/studio-gh-mark.svg" alt="No.Skip.FM mark">
    <h1>No.Skip<span class="accent">.</span>FM</h1>
    <p>Your personal vinyl listening room</p>
  </main>
</body>
</html>
